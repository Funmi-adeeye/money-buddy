<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Money Buddy</title>
<meta name="description" content="A gentle pink and purple budget buddy. Everything stays on your phone.">
<meta name="theme-color" content="#FFF3F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Buddy">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root {
  --petal: #FFF3F8;
  --card: #FFFFFF;
  --blush: #FFE3EF;
  --rose: #E86BA8;
  --roseSoft: #F7B3D2;
  --lilac: #EEE4FC;
  --orchid: #A77BDB;
  --plum: #4E2F63;
  --text: #5A4468;
  --muted: #9C88AA;
  --line: #F4E2EE;
  --good: #6FC79D;
  --goodSoft: #E2F6EC;
  --warn: #E98A6F;
  --warnSoft: #FDE8E1;
  --shadow: 0 4px 14px rgba(176, 111, 176, 0.13);
  --tabH: calc(62px + env(safe-area-inset-bottom, 0px));
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--petal);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

#root { min-height: 100vh; }

.screen {
  padding: 18px 18px calc(var(--tabH) + 28px);
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  max-width: 560px;
  margin: 0 auto;
}

.loading { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--rose); font-weight: 700; }

h1.screen-title { font-size: 30px; font-weight: 900; color: var(--plum); margin: 4px 0 14px; }

.card {
  background: var(--card);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card.lilac { background: var(--lilac); }
.card.blush { background: var(--blush); }
.card.good { background: var(--goodSoft); }
.card.center { text-align: center; }

.card h2 { font-size: 18px; font-weight: 800; color: var(--plum); margin: 0 0 8px; }
.body { font-size: 15px; line-height: 1.45; margin: 0 0 2px; }
.small { font-size: 13px; line-height: 1.4; color: var(--muted); margin: 0; }
.label { font-size: 14px; font-weight: 700; color: var(--plum); margin-bottom: 6px; display: block; }
.field { margin-bottom: 12px; }
.italic { font-style: italic; }

.hero {
  background: var(--lilac);
  border-radius: 32px;
  padding: 22px;
  margin-bottom: 16px;
  border: 2px solid #fff;
  box-shadow: var(--shadow);
}
.hero-hi { font-size: 32px; font-weight: 900; color: var(--plum); margin: 0; }
.hero-sub { font-size: 15px; color: var(--text); margin: 4px 0 0; }
.hero-income { font-size: 40px; font-weight: 900; color: var(--rose); margin: 14px 0 0; }
.hero-pills { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.pill { padding: 6px 12px; border-radius: 999px; background: #fff; color: var(--muted); font-weight: 700; font-size: 13px; }
.pill.on { background: var(--rose); color: #fff; }

.btn {
  display: block;
  width: 100%;
  border: none;
  border-radius: 999px;
  padding: 15px;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  background: var(--rose);
  color: #fff;
  margin-top: 4px;
  cursor: pointer;
}
.btn:active { filter: brightness(0.95); }
.btn.soft { background: var(--lilac); color: var(--plum); }
.btn.ghost { background: transparent; color: var(--plum); padding: 10px; }
.btn.danger { background: var(--warnSoft); color: var(--warn); }
.btn:disabled { opacity: 0.45; }

.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.row-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

.chip {
  border: 1.5px solid var(--line);
  background: var(--petal);
  color: var(--text);
  border-radius: 999px;
  padding: 9px 12px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 6px;
}
.chip.on { background: var(--roseSoft); border-color: var(--rose); color: var(--plum); }
.chip.grow { flex: 1; min-width: 0; }

input, textarea {
  width: 100%;
  background: var(--petal);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 16px;
  font-family: inherit;
  color: var(--plum);
  min-width: 0;
}
input:focus, textarea:focus { outline: 2px solid var(--roseSoft); outline-offset: 1px; }
textarea { min-height: 90px; resize: vertical; }
::placeholder { color: var(--muted); }

.num { display: flex; align-items: center; background: var(--petal); border: 1.5px solid var(--line); border-radius: 14px; padding-left: 14px; }
.num:focus-within { outline: 2px solid var(--roseSoft); outline-offset: 1px; }
.num span { color: var(--muted); font-weight: 700; margin-right: 4px; }
.num input { border: none; background: transparent; padding-left: 0; }
.num input:focus { outline: none; }

.money-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; gap: 8px; }
.money-row .left { flex: 1; min-width: 0; }
.money { font-size: 15px; font-weight: 800; color: var(--text); white-space: nowrap; }
.bold .body, .money-row.bold .money { font-weight: 800; color: var(--plum); }
.divider { height: 1px; background: var(--line); margin: 8px 0; }

.bar { background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 4px; height: 10px; }
.bar > div { height: 100%; border-radius: 999px; }
.ribbon { display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: var(--line); margin-top: 4px; }

.alert { background: var(--warnSoft); color: #A4533C; border-radius: 14px; padding: 12px; margin-top: 8px; font-size: 14px; line-height: 1.45; }
.alert.happy { background: var(--goodSoft); color: #3E8A66; }
.saved-note { text-align: center; color: var(--rose); font-weight: 800; margin-top: 10px; font-size: 15px; }

.month-picker { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 999px; padding: 6px; margin-bottom: 12px; box-shadow: var(--shadow); }
.month-arrow { width: 40px; height: 40px; border-radius: 20px; background: var(--blush); border: none; color: var(--rose); font-size: 24px; font-weight: 900; line-height: 1; cursor: pointer; }
.month-text { font-size: 17px; font-weight: 800; color: var(--plum); }

.goal-name { font-size: 19px; font-weight: 800; color: var(--plum); margin: 0; }
.edit-link { color: var(--rose); font-weight: 800; font-size: 15px; }
.tag { background: var(--lilac); color: var(--plum); border-radius: 999px; padding: 5px 10px; font-weight: 700; font-size: 13px; margin-bottom: 4px; display: inline-block; }

.item-box { background: #FFFAFC; border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
.total-pill { display: inline-block; border-radius: 999px; padding: 6px 12px; margin-bottom: 10px; font-weight: 800; }
.total-pill.ok { background: var(--goodSoft); color: #3E8A66; }
.total-pill.off { background: var(--warnSoft); color: var(--warn); }

.stars { font-size: 22px; color: var(--rose); letter-spacing: 2px; }
.stars.big { font-size: 28px; }
.big-score { font-size: 44px; font-weight: 900; color: var(--plum); margin: 4px 0; }
.badge-emoji { font-size: 44px; }
.badge-title { font-size: 24px; font-weight: 900; color: var(--rose); margin: 4px 0; }

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -4px 14px rgba(176, 111, 176, 0.13);
  display: flex;
  padding: 8px 0 calc(6px + env(safe-area-inset-bottom, 0px));
  z-index: 10;
}
.tab { flex: 1; background: none; border: none; font-family: inherit; cursor: pointer; padding: 0; }
.tab .icon { width: 44px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 18px; }
.tab.on .icon { background: var(--blush); }
.tab .tab-label { font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; display: block; }
.tab.on .tab-label { color: var(--rose); }

.install-tip { background: var(--lilac); border-radius: 18px; padding: 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.45; color: var(--text); }
.install-tip button { background: none; border: none; color: var(--rose); font-weight: 800; font-family: inherit; font-size: 14px; cursor: pointer; padding: 6px 0 0; }

.pin { text-align: center; letter-spacing: 8px; font-size: 22px; font-weight: 800; }
.pin::placeholder { letter-spacing: 4px; font-size: 16px; font-weight: 600; }

.save-bar {
  position: fixed;
  left: 0; right: 0;
  bottom: var(--tabH);
  background: var(--card);
  border-top: 2px solid var(--blush);
  box-shadow: 0 -6px 18px rgba(176, 111, 176, 0.18);
  padding: 14px 18px;
  z-index: 9;
}
.save-bar .row { max-width: 524px; margin: 0 auto; }
.save-bar > p, .save-bar > input { max-width: 524px; margin-left: auto; margin-right: auto; display: block; }

.log-entry { border-left: 3px solid var(--roseSoft); padding: 2px 0 2px 10px; margin-bottom: 14px; }
.card.warnCard { background: var(--warnSoft); }

</style>
</head>
<body>
<div id="root"><div class="loading">Money Buddy 💖</div></div>
